services:
  - type: web
    name: nexus-sync-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd backend && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DB_ENGINE
        value: postgresql
      - key: DB_NAME
        value: nexus_sync_db
      - key: DB_USER
        value: nexus_sync
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        value: dpg-dbaejjdg1s2s73bqjuug-a.oregon-postgres.render.com
      - key: DB_PORT
        value: "5432"